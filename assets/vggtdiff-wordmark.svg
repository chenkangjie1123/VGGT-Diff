<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 104" role="img" aria-labelledby="title desc">
  <title id="title">VGGT-Diff</title>
  <desc id="desc">VGGT-Diff wordmark with a camera trajectory integrated into the letter V.</desc>
  <defs>
